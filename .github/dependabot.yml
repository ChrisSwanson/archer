# The workflows pin every action to a commit (a tag can be moved); Dependabot proposes the updates.
# npm covers the root lockfile, which holds both workspaces (ts, ui) and the docs site's tools.
# Minor and patch updates arrive as one weekly PR per ecosystem, so CI runs once for the batch.
# Majors are not grouped: each arrives as its own PR, to be upgraded deliberately. They are not
# ignored either, since ignore rules may also filter a security update that needs a major.
# The cooldown applies to version updates only; security updates are never delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node 22 is the supported runtime (engines: >=22.18); the types follow it.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # axe 4.14 adds label-content-name-mismatch, which the app fails in many places (diagram nodes,
      # menus, cues). Held at 4.13 until that accessibility pass lands; then delete this rule.
      - dependency-name: "@axe-core/playwright"
        versions: [">=4.14"]
      # jsdom 27 computes accessible names from display without the app's CSS (Vitest feeds jsdom none), so
      # flex children read as inline and five component tests see "Files2 active" where Chromium, with the
      # real CSS, says "Files 2 active". jsdom 31 also serializes CSSOM as browsers do, which three tests do
      # not expect yet. Held at 26 until the component tests load their stylesheets; then delete this rule.
      - dependency-name: "jsdom"
        versions: [">=27"]
      # TypeScript 7 (the native compiler) ships no stable JS API: `import ts from "typescript"` is only
      # its version, and the AST lives under typescript/unstable/*. site/scripts/cli-reference.mts and its
      # test walk the AST, and vue-tsc builds on the JS API. Held at 6.x until both have a stable path.
      - dependency-name: "typescript"
        versions: [">=7"]
