# Hostile content for the security rubric's G7 probe (P6): docs/quality/rubrics/security.md.
# Every payload, when it runs, writes window.__xss (or opens a dialog, or reaches the canary
# host xss-canary.invalid), so ui/tests/browser-ts/xss-corpus.e2e.ts can tell which one ran.
# `*-inert` diagrams must compile and be drawn as text; `*-refused` diagrams must be refused.
# A sandbox: node tools/devkit/sandbox.mjs up --name sec-b --tls --corpus tools/devkit/corpus/hostile
# This project sits one level down so the default devkit corpus (tools/devkit/corpus) does not pick it up.
version = 1
name = "Hostile corpus"
folder = ".archer"

[[views]]
id = "flow-inert"
kind = "freeform"
title = "Flow x\" onmouseover=\"window.__xss='toml-title'"
source = ".archer/diagrams/flow-inert.mmd"

[[views]]
id = "flow-refused"
kind = "freeform"
title = "Flow refused"
source = ".archer/diagrams/flow-refused.mmd"

